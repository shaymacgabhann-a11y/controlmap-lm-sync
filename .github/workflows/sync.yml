name: Nightly sync

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints planned changes; live writes to Lifecycle Manager"
        type: choice
        options: [dry-run, live]
        default: dry-run

# Never run two syncs at once; they'd race on state.json and could double-create.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write # to commit state/state.json after live runs

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Scheduled runs stay in dry-run until the repo variable SYNC_LIVE is set to "true".
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          elif [ "${{ vars.SYNC_LIVE }}" = "true" ]; then
            mode=live
          else
            mode=dry-run
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Running in $mode mode"

      - name: Sync
        env:
          SCALEPAD_API_KEY: ${{ secrets.SCALEPAD_API_KEY }}
        run: python -m cmlm ${{ steps.mode.outputs.mode == 'live' && '--live' || '' }}

      - name: Commit state
        if: always() && steps.mode.outputs.mode == 'live'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || (git commit -m "chore: update sync state [skip ci]" && git push)
